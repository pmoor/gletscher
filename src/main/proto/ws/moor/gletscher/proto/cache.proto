syntax = "proto3";

package ws.moor.gletscher.proto;

message CachedFileHeader {
  string name = 1;
  bytes md5 = 2;
  int32 size = 3;
  map<string, string> metadata = 4;
  optional string storage_class = 5;
  optional int64 created_time_millis = 6;
}

message CachedListing {
  int64 retrieved_at_millis = 1;
  repeated CachedFileHeader file = 2;
}
